name: CI/CD Backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: backend-api:ci
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Comprobar credenciales de Docker Hub
        id: docker_secrets
        shell: bash
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publicación omitida: configura DOCKER_USERNAME y DOCKER_PASSWORD."
          fi
      - uses: actions/checkout@v4
        if: steps.docker_secrets.outputs.available == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.docker_secrets.outputs.available == 'true'
      - uses: docker/login-action@v3
        if: steps.docker_secrets.outputs.available == 'true'
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        if: steps.docker_secrets.outputs.available == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/backend-api:latest
            ${{ env.DOCKER_USERNAME }}/backend-api:${{ github.sha }}
